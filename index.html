<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Predictivo Pro - Uruguay</title>
    <!-- Cargamos la API de Autocompletado de Google Maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=&libraries=places"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; padding: 15px; color: #333; margin: 0; }
        .card { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 600px; margin: auto; border-top: 6px solid #d9534f; }
        h2 { font-size: 18px; color: #333; margin-top: 0; text-align: center; }
        .alert { background: #fcf8e3; border: 1px solid #faebcc; padding: 12px; font-size: 13px; margin-bottom: 15px; border-radius: 5px; color: #8a6d3b; font-weight: bold; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        #map { width: 100%; height: 280px; border-radius: 6px; margin-top: 15px; border: 2px solid #ccc; }
        button { background: #5cb85c; color: white; border: none; padding: 14px; margin-top: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #4cae4c; }
        .result-box { margin-top: 15px; background: #dff0d8; border: 1px solid #d0e9c6; padding: 12px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Validador Predictivo 99% Exacto - Prosegur</h2>
    <div class="alert">⚠️ Obligatorio: Escriba la dirección y selecciónela de la lista desplegable de Google para fijar el pin exacto.</div>
    
    <label>Buscar Dirección Exacta en Uruguay *</label>
    <input type="text" id="autocomplete" placeholder="Ej: Horacio García Lagos, Solymar, Canelones" autocomplete="off">

    <label>Manzana y Solar / Número de Puerta (Opcional para referencia interna)</label>
    <input type="text" id="detallesExtra" placeholder="Ej: Manzana 37, Solar 7">

    <label>Observaciones (Ej: Portón blanco, timbre roto)</label>
    <textarea id="notas" placeholder="Referencias adicionales para el técnico"></textarea>

    <!-- Mapa visual de confirmación -->
    <div id="map"></div>

    <button onclick="copiarLinkFinal()">✅ Copiar Link Exacto para Salesforce</button>

    <div class="result-box" id="seccionResultado">
        <label style="color: #3c763d;">Link GPS listo para Salesforce:</label>
        <input type="text" id="linkFinal" readonly style="background: #fff; font-weight: bold;">
    </div>
</div>

<script>
    var map, marker, autocomplete;
    var selectedLatLng = null;

    function initMap() {
        // Centro inicial en Uruguay (Canelones/Montevideo)
        var defaultLatLon = { lat: -34.8335, lng: -55.9715 };

        map = new google.maps.Map(document.getElementById('map'), {
            center: defaultLatLon,
            zoom: 15
        });

        marker = new google.maps.Marker({
            map: map,
            draggable: true,
            position: defaultLatLon
        });

        // Actualizar coordenadas si el operador arrastra el marcador manualmente
        marker.addListener('dragend', function() {
            selectedLatLng = marker.getPosition();
        });

        // Autocompletado inteligente restringido a Uruguay
        var input = document.getElementById('autocomplete');
        autocomplete = new google.maps.places.Autocomplete(input, {
            componentRestrictions: { country: 'uy' },
            fields: ['geometry', 'name', 'formatted_address']
        });

        autocomplete.addListener('place_changed', function() {
            var place = autocomplete.getPlace();
            if (!place.geometry || !place.geometry.location) {
                alert("No se encontró la ubicación exacta para esa selección.");
                return;
            }

            // Ubicar el mapa y el pin exactamente donde eligió el operador
            map.setCenter(place.geometry.location);
            map.setZoom(18); // Zoom cercano a nivel de finca
            marker.setPosition(place.geometry.location);
            selectedLatLng = place.geometry.location;
        });
    }

    // Inicializar mapa al cargar la página
    window.onload = initMap;

    function copiarLinkFinal() {
        if (!selectedLatLng) {
            alert("Por favor, escriba la dirección y selecciónela de la lista desplegable de Google.");
            return;
        }

        let lat = selectedLatLng.lat();
        let lng = selectedLatLng.lng();
        let detalles = document.getElementById('detallesExtra').value;
        let notas = document.getElementById('notas').value;

        // Link basado en coordenadas puros (GPS real)
        let linkGps = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

        document.getElementById('linkFinal').value = linkGps;
        document.getElementById('seccionResultado').style.display = 'block';

        navigator.clipboard.writeText(linkGps);
        alert("¡Link GPS exacto copiado al portapapeles! Ya puedes pegarlo en Salesforce.");
    }
</script>

</body>
</html>
